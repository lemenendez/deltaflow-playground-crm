name: Auto PR develop -> main

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: auto-pr-develop-to-main
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ensure-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.AUTO_PR_TOKEN || github.token }}
    steps:
      - name: Check for existing open PR
        id: existing
        run: |
          PR_JSON="$(gh pr list \
            --repo "${{ github.repository }}" \
            --base main \
            --head develop \
            --state open \
            --json number,url \
            --jq '.[0]')"

          PR_URL="$(jq -r '.url // empty' <<< "$PR_JSON")"
          PR_NUMBER="$(jq -r '.number // empty' <<< "$PR_JSON")"

          if [[ -n "$PR_URL" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "Open PR already exists: $PR_URL"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No open PR found for develop -> main"
          fi

      - name: Create pull request
        if: steps.existing.outputs.exists == 'false'
        id: create
        run: |
          TODAY="$(date +%Y-%m-%d)"
          HEAD_LINE="$(jq -r '.head_commit.message // "release sync"' "$GITHUB_EVENT_PATH" | head -n 1)"
          COMMIT_COUNT="$(jq -r '(.commits // []) | length' "$GITHUB_EVENT_PATH")"
          CLEAN_HEAD_LINE="$(echo "$HEAD_LINE" | tr -s ' ' | cut -c1-60)"
          TITLE="Promote develop to main: $CLEAN_HEAD_LINE ($COMMIT_COUNT commits) - $TODAY"

          BODY=$(cat <<'EOF'
          ## Automated Promotion PR

          This PR was created automatically because a push landed on `develop` and no open PR to `main` existed.

          ### What this does
          - Keeps a single promotion PR from `develop` to `main`
          - Avoids duplicate open PRs

          ### Suggested checks before merge
          - [ ] CI checks pass
          - [ ] Changelog/release notes validated
          - [ ] Manual smoke test completed
          EOF
          )

          set +e
          CREATE_OUTPUT="$(gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head develop \
            --title "$TITLE" \
            --body "$BODY" 2>&1)"
          CREATE_STATUS=$?
          set -e

          if [[ $CREATE_STATUS -ne 0 ]]; then
            echo "$CREATE_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "failure_reason=pr-create-permission-or-validation" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "$CREATE_OUTPUT"

          PR_NUMBER="$(gh pr list \
            --repo "${{ github.repository }}" \
            --base main \
            --head develop \
            --state open \
            --json number \
            --jq '.[0].number')"

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "failed=false" >> "$GITHUB_OUTPUT"

      - name: Resolve target PR number
        id: target
        run: |
          if [[ "${{ steps.existing.outputs.exists }}" == "true" ]]; then
            echo "number=${{ steps.existing.outputs.number }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.create.outputs.failed }}" != "true" ]]; then
            echo "number=${{ steps.create.outputs.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment latest push summary (best effort)
        if: github.event_name == 'push' && steps.target.outputs.number != ''
        continue-on-error: true
        run: |
          SHORT_SHA="$(jq -r '.after // ""' "$GITHUB_EVENT_PATH" | cut -c1-7)"
          PUSHER="$(jq -r '.pusher.name // "unknown"' "$GITHUB_EVENT_PATH")"
          COMPARE_URL="$(jq -r '.compare // ""' "$GITHUB_EVENT_PATH")"
          NOW_UTC="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"

          CHANGES="$(jq -r '
            [(.commits // [])[]? | "- " + (.id[0:7]) + " " + ((.message | split("\\n")[0]) // "(no message)")] |
            if length == 0 then "- (No commit details available in payload)" else join("\\n") end
          ' "$GITHUB_EVENT_PATH")"

          BODY=$(cat <<EOF
          ## Push Summary

          Latest push by **$PUSHER** on **develop** at **$NOW_UTC** (after: **$SHORT_SHA**).

          ### Included commits
          $CHANGES

          ### Compare view
          $COMPARE_URL
          EOF
          )

          gh pr comment "${{ steps.target.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --body "$BODY"

      - name: Summary
        run: |
          if [[ "${{ steps.existing.outputs.exists }}" == "true" ]]; then
            echo "No action needed. Existing PR: ${{ steps.existing.outputs.url }}"
          elif [[ "${{ steps.create.outputs.failed }}" == "true" ]]; then
            echo "PR was not created. If using GITHUB_TOKEN, enable Actions permission to create PRs, or set AUTO_PR_TOKEN secret with repo scope."
          else
            echo "Created PR #${{ steps.create.outputs.number }} for develop -> main"
          fi
